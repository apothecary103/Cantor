[package]
name = "cantor-bridge-clap"
description = "Cantor DAW bridge plugin (CLAP): plays Cantor renders in sync with the host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cantor-bridge.workspace = true
clack-plugin.workspace = true
clack-extensions = { workspace = true, features = ["audio-ports", "clack-plugin"] }

[dev-dependencies]
clack-host = { workspace = true, features = ["clack-plugin"] }
clack-extensions = { workspace = true, features = ["audio-ports", "clack-plugin", "clack-host"] }

[lints]
workspace = true
