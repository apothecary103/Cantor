[package]
name = "cantor-mcp"
description = "Cantor's MCP server for AI agents, and its conformance fixture server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cantor-mcp"
path = "src/main.rs"

[[bin]]
name = "cantor-mcp-conformance"
path = "src/bin/cantor-mcp-conformance.rs"

[dependencies]
cantor-core.workspace = true
cantor-render.workspace = true
cantor-server.workspace = true
serde.workspace = true
schemars.workspace = true
rmcp.workspace = true
tokio.workspace = true
axum.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
cantor-fixtures.workspace = true

[lints]
workspace = true
